name: Vérifier le carrousel des projets
on:
  push:
    branches: [verification-project-logos]
permissions:
  contents: read
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Vérifier le rendu et l’isolation du carrousel
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .review/check-logos.mjs
