name: Vérifier le portfolio Underground
on:
  push:
    branches: [verification-underground]
permissions:
  contents: read
jobs:
  bureau:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Résoudre les versions des dépendances
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "console.log('LOCK_BEGIN' + JSON.stringify(require('./package-lock.json')) + 'LOCK_END')"
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Tester les parcours et les cadrages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .review/check.mjs
