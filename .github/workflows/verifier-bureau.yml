name: Vérifier le bureau immersif
on:
  push:
    branches: [verification-bureau-immersif]
permissions:
  contents: write
jobs:
  bureau:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Optimiser la photographie fournie
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          photo = Image.open('.review/source.png').convert('RGB')
          assert photo.size == (1671, 941)
          photo.save('public/images/atelier.webp', 'WEBP', quality=90, method=6)
          PY
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Tester les parcours et les cadrages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .review/check.mjs
      - name: Transmettre les images vérifiées au dépôt privé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in public/images/atelier.webp .review/1440.jpg .review/390.jpg; do
            base64 -w0 "$asset" | jq -Rs '{content:.,encoding:"base64"}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha' > "$RUNNER_TEMP/asset-sha"
            echo "ASSET $asset $(cat "$RUNNER_TEMP/asset-sha") $(wc -c < "$asset")"
          done
